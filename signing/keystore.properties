# Public release signing key for Watermark Remover.
#
# Committed on purpose: the app is distributed through GitHub Releases only, and a STABLE key
# is what allows an update to be installed over the previous version without uninstalling.
# (A signing key can never be kept secret in a build that must work from a public repo with no
# secrets configured.) To switch to a private key later, create `keystore.properties` at the repo
# root (git-ignored) or set KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD as
# repository secrets: both take precedence over this file. Note that changing the key forces a
# one-time uninstall for existing users.
storeFile=release.jks
storePassword=watermark-remover-public
keyAlias=watermark
keyPassword=watermark-remover-public
