name: Release

# Publishes an installable APK on the GitHub "Releases" page, so anyone can download it
# directly from GitHub (no Android Studio needed).
#
# Two ways to trigger it:
#   1. Push a tag:            git tag v1.0.0 && git push origin v1.0.0
#   2. Manually:              Actions tab -> "Release" -> "Run workflow" -> enter a version
#
# Signing: the release keystore is NEVER committed to the repository (a public key in a public
# repo lets anyone publish an APK that Android would install as an update). It is restored from
# these repository secrets (Settings -> Secrets and variables -> Actions):
#   KEYSTORE_BASE64   : base64 of your .jks file  (base64 -w0 my-release-key.jks)
#   KEYSTORE_PASSWORD : keystore password
#   KEY_ALIAS         : key alias
#   KEY_PASSWORD      : key password
# Without them the build fails on purpose: a debug-signed release cannot update an installed app.
# (Switching keys forces existing users to uninstall once.)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 1.0.0). A tag v<version> is created if missing."
        required: true
        default: "1.0.0"
      prerelease:
        description: "Mark as pre-release"
        type: boolean
        default: false

permissions:
  contents: write # needed to create the release and upload the APK

jobs:
  release:
    name: Build & publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve version
        id: ver
        shell: bash
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="${INPUT_VERSION}"
            VERSION="${VERSION#v}"
          fi
          # The version ends up in a tag name, a file name and the APK's versionName: it is
          # validated instead of interpolated anywhere it could be interpreted as code or a path.
          if [[ ! "$VERSION" =~ ^[0-9]+(\.[0-9]+){1,3}$ ]]; then
            echo "::error::Invalid version '$VERSION' (expected e.g. 1.2.3)."
            exit 1
          fi
          # versionCode must be a monotonically increasing integer: use the run number.
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Publishing version ${VERSION} (versionCode ${GITHUB_RUN_NUMBER})"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v5

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # The keystore itself is never committed: it comes from the repository secrets.
      - name: Require the release keystore secrets
        if: ${{ env.KEYSTORE_BASE64 == '' }}
        run: |
          echo "::error::KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD secrets are not configured. Refusing to publish an APK."
          exit 1
      - name: Restore private release keystore
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          umask 077
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          # Values are written through the environment, never interpolated into the script: a secret
          # containing a quote, a $ or a newline cannot break out of the shell code.
          {
            printf 'storeFile=%s\n' "$RUNNER_TEMP/release.jks"
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > keystore.properties
          echo "Release keystore restored."

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Build release APK
        run: >
          ./gradlew assembleRelease --no-daemon --stacktrace
          -PrequireReleaseSigning=true
          -PversionName=${{ steps.ver.outputs.version }}
          -PversionCode=${{ steps.ver.outputs.code }}

      - name: Verify signing certificate
        shell: bash
        run: |
          set -euo pipefail
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n1)
          # apksigner verifies the signature AND prints the signer certificates. Its wording is
          # NOT stable across SDK build-tools:
          #   <= 36.1.0: "Signer #1 certificate SHA-256 digest: <hex>"
          #   >= 37.0.0: "V2 Signer: certificate SHA-256 digest: <hex>" (one line per scheme)
          # so this step must never grep for those exact words (that is what broke the release:
          # the APK was signed correctly but "Number of signers: 1" no longer existed, so the
          # check reported a false failure). Only stable facts are asserted here:
          #   - apksigner exited 0 (the signature verifies);
          #   - exactly one DISTINCT signer certificate (same key under v2+v3 counts once).
          "$APKSIGNER" verify --print-certs "$APK" | tee cert.txt
          # Every line that names a certificate digest, whatever its prefix; hex is lowercase.
          mapfile -t CERTS < <(grep -ioE "certificate SHA-256 digest: [0-9a-fA-F]{64}" cert.txt \
            | tr 'A-F' 'a-f' | sed 's/.*: //' | sort -u)
          if [ "${#CERTS[@]}" -eq 0 ]; then
            echo "::error::apksigner printed no certificate SHA-256 digest (its output format changed again) — see cert.txt above."
            exit 1
          fi
          if [ "${#CERTS[@]}" -ne 1 ]; then
            echo "::error::APK is signed by ${#CERTS[@]} distinct certificates instead of exactly one."
            exit 1
          fi
          echo "Signing certificate SHA-256: ${CERTS[0]}"
          # Defense in depth (the Gradle guard above already refuses to build a release APK with
          # the debug key): the published APK must never be debug-signed. The DN is present in
          # both output formats, so a plain substring keeps working either way.
          if grep -q "Android Debug" cert.txt; then
            echo "::error::APK is signed with the Android debug key – updates would not install over previous versions."
            exit 1
          fi
          # The published SHA-256 must be produced from the very file that was verified.
          sha256sum "$APK"

      - name: Collect artifacts
        id: apk
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          test -f "$APK"
          mkdir -p dist
          NAME="WatermarkRemover-${VERSION}.apk"
          cp "$APK" "dist/$NAME"
          (cd dist && sha256sum "$NAME" > "$NAME.sha256")
          echo "path=dist/$NAME" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "sha=$(cut -d' ' -f1 dist/$NAME.sha256)" >> "$GITHUB_OUTPUT"

      - name: Create tag (manual runs only)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists locally."
          elif git ls-remote --exit-code --tags origin "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists on origin."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Watermark Remover ${{ steps.ver.outputs.version }}
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
          generate_release_notes: true
          files: |
            ${{ steps.apk.outputs.path }}
            ${{ steps.apk.outputs.path }}.sha256
          body: |
            ## 📲 Installation

            1. Sur votre téléphone Android, téléchargez **`${{ steps.apk.outputs.name }}`** ci-dessous.
            2. Ouvrez le fichier ; autorisez « Installer des applications inconnues » pour votre navigateur si Android le demande.
            3. Lancez **Watermark Remover**.

            - Android 7.0 (API 24) minimum • Vos vidéos ne quittent jamais l'appareil.
            - Les mises à jour s'installent **par-dessus** la version précédente (même clé de signature depuis la 1.4.0).
              Si vous avez une version ≤ 1.3.0, désinstallez-la une dernière fois avant d'installer celle-ci.
            - SHA-256 : `${{ steps.apk.outputs.sha }}`

            > L'application vérifie ce SHA-256 avant de vous proposer la mise à jour.

            ---
            _Build automatique : versionCode ${{ steps.ver.outputs.code }}, commit ${{ github.sha }}_
