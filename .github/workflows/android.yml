name: Android CI

# Runs on every push / PR: unit tests + debug & release APKs.
# APKs are attached to the workflow run as artifacts (Actions tab -> run -> "Artifacts").
# For a one-click public download link, see release.yml (creates a GitHub Release).

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"] # tags are handled by release.yml
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test & build APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Compiler errors are copied into the job summary (readable through the API) and
      # emitted as annotations, so failures can be diagnosed without downloading logs.
      - name: Unit tests
        shell: bash
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --no-daemon --stacktrace --console=plain 2>&1 | tee build-test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            { echo "### Unit tests failed"; echo '```'; grep -E "^e: |^w: |error:|What went wrong|Caused by|FAILED|Unresolved reference|Execution failed|Could not" build-test.log | head -120; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            grep -E "^e: |What went wrong|Execution failed" build-test.log | head -50 | sed 's/^/::error::/'
          fi
          exit $status

      - name: Build debug & release APKs
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace --console=plain 2>&1 | tee build-apk.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            { echo "### APK build failed"; echo '```'; grep -E "^e: |^w: |error:|What went wrong|Caused by|FAILED|Unresolved reference|Execution failed|Could not" build-apk.log | head -120; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            grep -E "^e: |What went wrong|Execution failed" build-apk.log | head -50 | sed 's/^/::error::/'
          fi
          exit $status

      # Publishes the error digest as a check-run so it can be fetched via the REST API.
      - name: Publish error digest
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let out = '';
            for (const f of ['build-test.log', 'build-apk.log']) {
              if (!fs.existsSync(f)) continue;
              const lines = fs.readFileSync(f, 'utf8').split('\n')
                .filter(l => /^e: |^w: |error:|What went wrong|Caused by|FAILED|Unresolved reference|Execution failed|Could not/.test(l));
              out += `## ${f}\n` + lines.slice(0, 150).join('\n') + '\n\n';
            }
            if (!out) out = 'No matching error lines captured.';
            await github.rest.checks.create({
              owner: context.repo.owner, repo: context.repo.repo,
              name: 'build-errors', head_sha: context.sha, status: 'completed', conclusion: 'neutral',
              output: { title: 'Build error digest', summary: out.slice(0, 60000) },
            });

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: WatermarkRemover-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: WatermarkRemover-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload logs & reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build-*.log
            app/build/reports/
          if-no-files-found: ignore
