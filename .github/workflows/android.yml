name: Android CI

# Runs on every push / PR: unit tests + debug & release APKs.
# APKs are attached to the workflow run as artifacts (Actions tab -> run -> "Artifacts").
# For a one-click public download link, see release.yml (creates a GitHub Release).

on:
  push:
    branches: ["**"]
    tags-ignore: ["v*"] # tags are handled by release.yml
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test & build APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Compiler errors are echoed as GitHub annotations (::error::) so they show up in the
      # run summary and via the API, not only in the raw log.
      - name: Unit tests
        shell: bash
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --no-daemon --stacktrace --console=plain 2>&1 | tee build-test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E "^e: |error:|What went wrong|Caused by|FAILED|Unresolved reference" build-test.log | head -80 | sed 's/^/::error::/'
          fi
          exit $status

      - name: Build debug & release APKs
        shell: bash
        run: |
          set -o pipefail
          ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace --console=plain 2>&1 | tee build-apk.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            grep -E "^e: |error:|What went wrong|Caused by|FAILED|Unresolved reference" build-apk.log | head -80 | sed 's/^/::error::/'
          fi
          exit $status

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: WatermarkRemover-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: WatermarkRemover-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload logs & reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build-*.log
            app/build/reports/
          if-no-files-found: ignore
